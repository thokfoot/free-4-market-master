name: LIVE P&L v5.7 (Market Hours)

on:
  schedule:
    # ── India Market: 03:45-10:00 UTC (09:15-15:30 IST) Mon-Fri ──
    - cron: '*/5 3-9 * * 1-5'
    - cron: '*/5 10 * * 1-5'
    
    # ── US Market: 13:30-20:30 UTC (19:00-02:00 IST) Mon-Fri ──
    - cron: '*/5 13-20 * * 1-5'
    
    # ── Crypto: 24/7 every 30 min ──
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free4market-v5-live
  cancel-in-progress: false

jobs:
  live-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests pytz

      - name: Run Live P&L Updater
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_pnl_updater.py

      - name: Commit logs
        run: |
          git config --local user.email "bot@paper-trade.com"
          git config --local user.name "paper-trade-bot"
          git add logs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "live pnl $(date -u +'%Y-%m-%d %H:%M UTC')"
          if ! git push; then
            sleep 2
            git pull --rebase
            git push
          fi
