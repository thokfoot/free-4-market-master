name: LIVE P&L v5.10 (Market Hours)

on:
  schedule:
    # ── India Market: 09:10-15:45 IST (03:40-10:15 UTC) Mon-Fri ──
    # Tightened from the old 08:30-16:25 IST window: pre-open/post-close
    # runs just burned minutes; config.market_active_for_mode now enforces
    # the same window in code. Late slots cover the 15:30 square-off.
    - cron: '40,45,50,55 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0,5,15 10 * * 1-5'

    # ── US Market: 13:25-20:15 UTC (EDT) + 21:00-21:10 UTC EST tail ──
    # Cron spans both DST variants; the code gate (US_ACTIVE_*_ET) is the
    # DST-correct truth and skips runs outside the session.
    - cron: '*/5 13-20 * * 1-5'
    - cron: '0,10 21 * * 1-5'

    # ── Crypto: 24/7 every 30 min ──
    # Crypto positions are processed around the clock; INDIAN/US positions
    # are skipped outside their sessions by the per-market gate in
    # live_pnl_updater.py, so night runs can only emit crypto messages.
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Live P&L updates the same paper_trades.csv, portfolio, and Excel report
  # as bot/fade/gapdown workflows. Use one lock for all state writers.
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  live-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache.json
          key: ohlc-cache-${{ github.ref }}-${{ hashFiles('data/ohlc_cache.json') }}
          restore-keys: |
            ohlc-cache-${{ github.ref }}-
            ohlc-cache-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live P&L Updater
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_AUDIT_ARCHIVE: '1'
        run: python live_pnl_updater.py

      - name: Validate ledger and Excel
        run: python integrity_check.py --report

      - name: Commit logs
        run: |
          bash .ai/commit_logs.sh "live pnl $(date -u +'%Y-%m-%d %H:%M UTC')"

      # ── KEEP-ALIVE SELF-RESCHEDULE ──────────────────────────────
      # GitHub Actions cron is unreliable: 2026-08-11 no scheduled run
      # fired for 75 min (09:45→11:00 IST) while 7 gap-down scalps were
      # open — all rode through SL to expiry (~Rs 20,000 needless loss).
      # This step re-triggers the workflow ~2 min later while any
      # time-sensitive (GAP_DOWN_1m / INTRADAY_1h) position is open and
      # its market is active, so SL/TP/expiry checks self-heal instead
      # of depending on the platform scheduler.
      - name: Keep-alive reschedule (self-healing SL/expiry)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Self-healing SL/expiry loop. GitHub Actions cron is unreliable
          # (2026-08-11: 75 min with zero runs while 7 gap-down scalps were
          # open, all rode through SL). While time-sensitive positions are
          # open and their market is active, keepalive_guard.py exits 0 and
          # this step re-triggers the workflow ~2 min later, so SL/expiry
          # checks never depend on the platform scheduler. Otherwise it
          # exits non-zero and the chain stops cleanly (success).
          if python keepalive_guard.py; then
            echo "[KeepAlive] rescheduling in 120s"
            sleep 120
            gh workflow run "LIVE P&L v5.10 (Market Hours)"
          else
            echo "[KeepAlive] chain stopped"
          fi
