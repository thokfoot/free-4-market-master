name: FADE SCAN (5-min)

on:
  schedule:
    # India market hours 09:15-15:30 IST = 03:45-10:00 UTC. Every 15 min,
    # starting 04:00 UTC (09:30 IST) when the first 15m candle completes.
    # Entry gating (paper_trader.check_entry_allowed) blocks any run that
    # lands after the 15:30 close from creating post-close fills.
    - cron: '*/15 4-9 * * 1-5'
    # US market hours 13:30-20:00 UTC — mode=fade skips India scanners when
    # India is closed and runs the US_FADE scanner instead (bot.py gates on
    # mkt.US OPEN/PRE-OPEN). Without these crons the US fade scanner ran
    # only on bot.yml's ~6 sparse both-mode runs and never caught signals
    # that its own 30-day backtest proved abundant (171 trades/mo replayed,
    # 0 captured live).
    - cron: '30/15 13 * * 1-5'
    - cron: '*/15 14-16 * * 1-5'
    - cron: '*/15 17-19 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # SHARED with bot.yml / gap_down.yml — all runs that touch paper_trades.csv
  # must serialize, or two parallel runs double-enter the same signal.
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  fade-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache.json
          key: ohlc-cache-${{ github.ref }}-${{ hashFiles('data/ohlc_cache.json') }}
          restore-keys: |
            ohlc-cache-${{ github.ref }}-
            ohlc-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FADE scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_AUDIT_ARCHIVE: '1'
        run: python bot.py --mode=fade

      - name: Validate ledger and Excel
        run: python integrity_check.py --report

      - name: Commit logs
        run: |
          bash .ai/commit_logs.sh "fade scan $(date -u +'%Y-%m-%d %H:%M UTC')"
