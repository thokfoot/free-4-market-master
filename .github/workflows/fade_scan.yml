name: FADE SCAN (5-min)

on:
  schedule:
    # India market hours 09:15-15:30 IST = 03:45-10:00 UTC. Every 5 min.
    - cron: '*/15 3-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # SHARED with bot.yml / gap_down.yml — all runs that touch paper_trades.csv
  # must serialize, or two parallel runs double-enter the same signal.
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  fade-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache.json
          key: ohlc-cache-${{ github.ref }}-${{ hashFiles('data/ohlc_cache.json') }}
          restore-keys: |
            ohlc-cache-${{ github.ref }}-
            ohlc-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FADE scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode=fade 2>&1 | grep -vE 'Failed download|JSONDecodeError|Expecting value' || true

      - name: Commit logs
        run: |
          bash .ai/commit_logs.sh "fade scan $(date -u +'%Y-%m-%d %H:%M UTC')"
