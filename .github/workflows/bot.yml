name: FREE-4-Market v5.0 PAPER TRADE

on:
  schedule:
    # 01:00 UTC = 6:30 AM IST → US Close / Market Open / Crypto daily
    - cron: '0 1 * * *'
    # 09:45 UTC = 3:15 PM IST → India Close (daily candle settled)
    - cron: '45 9 * * 1-5'
    # 12:30 UTC = 6:00 PM IST → India Close / US Open message
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free4market-v5-paper
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Paper Trade Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit logs & data
        run: |
          git config --local user.email "bot@paper-trade.com"
          git config --local user.name "paper-trade-bot"
          git pull --rebase --autostash || true
          git add logs/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "v5.0 paper trade scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || (git pull --rebase && git push)
