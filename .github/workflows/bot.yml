
name: v4 ULTIMATE GEM+PAPER
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit logs
        run: |
          git config --local user.email "bot@v4.com"
          git config --local user.name "v4 Bot"
          git add logs/
          git diff --staged --quiet || git commit -m "v4 logs $(date -u)"
          git push
