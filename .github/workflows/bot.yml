name: FREE 3-Market v5.12 PAPER TRADE (SWING + INTRADAY + FADE)

on:
  schedule:
    # Morning scan (India pre-open + Crypto)
    - cron: '0 1 * * *'
    # India close scan
    - cron: '45 9 * * 1-5'
    # Fade scans handled by dedicated fade_scan.yml (every 5 min, India hours)
    # 09:45 UTC = India close scan (mode=both: swing + intraday + fade gated on India open)
    # US pre-open scan
    - cron: '30 12 * * 1-5'
    # Intraday scans (US market hours)
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - swing
          - intraday
          - fade
          - gapdown

permissions:
  contents: write

concurrency:
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache.json
          key: ohlc-cache-${{ github.ref }}-${{ hashFiles('data/ohlc_cache.json') }}
          restore-keys: |
            ohlc-cache-${{ github.ref }}-
            ohlc-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine scan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs always run swing + intraday. FADE runs via the
            # dedicated fade_scan.yml workflow (every 5 min during India hours),
            # so no hour-based branching is needed here.
            echo "mode=both" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_AUDIT_ARCHIVE: '1'
        run: python bot.py --mode=${{ steps.mode.outputs.mode }}

      - name: Validate ledger and Excel
        run: python integrity_check.py --report

      - name: Commit logs
        run: |
          bash .ai/commit_logs.sh "v5.12 scan $(date -u +'%Y-%m-%d %H:%M UTC')"
