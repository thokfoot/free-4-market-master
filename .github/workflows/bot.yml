name: FREE 3-Market v5.12 PAPER TRADE (SWING + INTRADAY + FADE)

on:
  schedule:
    # Morning scan (Crypto only in practice: India + US are closed at this
    # hour, and entry gating rejects fills into closed markets anyway).
    # Weekdays ONLY — the old daily cron also ran Sat/Sun and produced
    # weekend entries at stale Friday prices.
    - cron: '0 1 * * 1-5'
    # India open swing run (04:00 UTC = 09:30 IST, shortly after NSE open).
    # Without this, no scheduled run falls inside India's 09:15-15:30 IST
    # window, so Indian swing entries could only ever fire manually.
    - cron: '0 4 * * 1-5'
    # India post-close scan (was 09:45 UTC = 15:15 IST, 15 min BEFORE the
    # NSE close -> swing entries filled on a still-forming daily bar).
    # 10:10 UTC = 15:40 IST, 10 minutes after the NSE close.
    - cron: '10 10 * * 1-5'
    # US pre-open scan
    - cron: '30 12 * * 1-5'
    # Intraday scans (US market hours)
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - swing
          - intraday
          - fade
          - gapdown

permissions:
  contents: write

concurrency:
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache.json
          key: ohlc-cache-${{ github.ref }}-${{ hashFiles('data/ohlc_cache.json') }}
          restore-keys: |
            ohlc-cache-${{ github.ref }}-
            ohlc-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine scan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs always run swing + intraday. FADE runs via the
            # dedicated fade_scan.yml workflow (every 5 min during India hours),
            # so no hour-based branching is needed here.
            echo "mode=both" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_AUDIT_ARCHIVE: '1'
        run: python bot.py --mode=${{ steps.mode.outputs.mode }}

      - name: Validate ledger and Excel
        run: python integrity_check.py --report

      - name: Commit logs
        run: |
          bash .ai/commit_logs.sh "v5.12 scan $(date -u +'%Y-%m-%d %H:%M UTC')"
