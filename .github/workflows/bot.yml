name: FREE 3-Market v5.12 PAPER TRADE (SWING + INTRADAY + FADE)

on:
  schedule:
    # Morning scan (India pre-open + Crypto)
    - cron: '0 1 * * *'
    # India close scan
    - cron: '45 9 * * 1-5'
    # Fade scans — after each NSE 1h candle closes (10:15-14:15 IST = 4:45-8:45 UTC)
    - cron: '45 4 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '45 8 * * 1-5'
    # 09:45 UTC = India close scan (mode=both: swing + intraday + fade gated on India open)
    # US pre-open scan
    - cron: '30 12 * * 1-5'
    # Intraday scans (US market hours)
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - swing
          - intraday
          - fade
          - gapdown

permissions:
  contents: write

concurrency:
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine scan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs: fade crons run during India hours (bot.py gates
            # on India market status internally), all others run swing+intraday.
            HOUR_UTC=$(date -u +'%H')
            MIN_UTC=$(date -u +'%M')
            # India 1h fade windows: 04:45-08:45 UTC (10:15-14:15 IST).
            # 09:45 UTC (15:15 IST) stays mode=both so the daily India-close
            # swing+intraday scan is preserved (both also includes fade,
            # gated on India market being open).
            if [ "$MIN_UTC" = "45" ] && [ "$HOUR_UTC" -ge 4 ] && [ "$HOUR_UTC" -le 8 ]; then
              echo "mode=fade" >> $GITHUB_OUTPUT
            else
              echo "mode=both" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode=${{ steps.mode.outputs.mode }}

      - name: Commit logs
        run: |
          git config --local user.email "bot@paper-trade.com"
          git config --local user.name "paper-trade-bot"
          git add logs/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "v5.10 scan $(date -u +'%Y-%m-%d %H:%M UTC') mode=${{ steps.mode.outputs.mode }}"
          if ! git push; then
            sleep 2
            git pull --rebase
            git push
          fi
