name: FREE 3-Market v5.10 PAPER TRADE (SWING + INTRADAY)

on:
  schedule:
    # Morning scan (India pre-open + Crypto)
    - cron: '0 1 * * *'
    # India close scan
    - cron: '45 9 * * 1-5'
    # US pre-open scan
    - cron: '30 12 * * 1-5'
    # Intraday scans (US market hours)
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - swing
          - intraday

permissions:
  contents: write

concurrency:
  group: free4market-v5-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine scan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Run BOTH swing + intraday on every scheduled trigger.
            # This prevents the bug where a delayed cron run picks the wrong mode
            # based on current hour instead of the intended schedule.
            echo "mode=both" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.mode || 'both' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode=${{ steps.mode.outputs.mode }}

      - name: Commit logs
        run: |
          git config --local user.email "bot@paper-trade.com"
          git config --local user.name "paper-trade-bot"
          git add logs/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "v5.10 scan $(date -u +'%Y-%m-%d %H:%M UTC') mode=${{ steps.mode.outputs.mode }}"
          if ! git push; then
            sleep 2
            git pull --rebase
            git push
          fi
