name: FREE-4-Market v4 ULTIMATE GEM+PAPER

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Bot v4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit logs
        run: |
          git config --local user.email "bot@v4.com"
          git config --local user.name "v4-bot"
          git add logs/ || true
          git diff --staged --quiet && echo "no changes to commit" && exit 0
          git commit -m "v4 logs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
