name: Gap-Down 1m Scan

on:
  schedule:
    # Indian market hours: 9:15 AM to 3:30 PM IST = 03:45 to 10:00 UTC
    # Runs every 5 minutes during 3-10 UTC (covers slightly wider range)
    #
    # NOTE: GitHub Actions scheduled runs are subject to arbitrary delays and
    # can be dropped under heavy load (observed: most 5-min runs never fire,
    # and those that do can be minutes-to-hours late). This is a platform
    # limitation — the scanner itself runs in ~90s after the parallelization fix.
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free4market-v5-gapdown
  cancel-in-progress: false

jobs:
  gap-down-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gap-Down Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode=gapdown

      - name: Commit logs
        run: |
          bash .ai/commit_logs.sh "gapdown scan $(date -u +'%Y-%m-%d %H:%M UTC')"
